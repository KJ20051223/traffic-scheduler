name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: bash -n install.sh
      - run: bash -n installer_platform.sh ci_platform.sh
      - run: python -m py_compile traffic_scheduler.py
  platform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:24.04
          - debian:11
          - debian:13
          - rockylinux/rockylinux:8
          - almalinux:9
          - oraclelinux:9
          - quay.io/centos/centos:stream9
          - fedora:44
          - amazonlinux:2023
          - opensuse/leap:16.0
          - opensuse/tumbleweed:latest
          - archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies, verify units and run local HTTP tests in distro
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace "$IMAGE" bash ci_platform.sh
